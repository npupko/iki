[package]
name = "soniox-audio"
version = "0.1.0"
edition = "2021"
description = "Capture the default microphone and stream it to Soniox realtime speech-to-text"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cpal = "0.18"
futures-util = "0.3"
# tokio-tungstenite builds rustls with default features off, which leaves it
# with no crypto provider. Enabling `ring` here selects one for the process.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
