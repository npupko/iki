[package]
name = "iki"
version = "0.1.0"
edition = "2021"
description = "Hold the Globe key to dictate through Soniox"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
iki-bar = { path = "../crates/iki-bar" }
globe-input = { path = "../crates/globe-input" }
soniox-audio = { path = "../crates/soniox-audio" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSSecureTextField",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSCalendar",
    "NSDate",
    "NSDateFormatter",
    "NSDictionary",
    "NSFormatter",
    "NSGeometry",
    "NSNotification",
    "NSString",
    "NSURL",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
security-framework = "3"
dispatch2 = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
